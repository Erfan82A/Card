<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="ERFAN ARABZADE — Trader & Investor"
>

<meta
    name="theme-color"
    content="#070706"
>

<meta
    name="color-scheme"
    content="dark"
>

<meta
    name="robots"
    content="index, follow"
>

<title>ERFAN ARABZADE — Trader & Investor</title>


<style>

/* =========================================================
   ERFAN ARABZADE
   DIGITAL BUSINESS CARD
   PRODUCTION FINAL

   STYLE:
   Matte Black × Brushed Gold
   Old Money × Institutional Finance

   No external libraries.
   No external fonts.
   No external images.
   No external dependencies.
   ========================================================= */


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: #070706;
}

body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;

    background:
        #070706;

    color: #eeeae1;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    overflow-x: hidden;
}


/* =========================================================
   PAGE BACKGROUND
   ========================================================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(194, 153, 70, 0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(194, 153, 70, 0.018) 1px,
            transparent 1px
        );

    background-size: 52px 52px;

    z-index: 0;
}


/* =========================================================
   PAGE
   ========================================================= */

.page {
    position: relative;
    z-index: 1;

    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    padding:
        18px 12px 40px;
}


/* =========================================================
   MAIN CARD
   ========================================================= */

.card {
    position: relative;

    overflow: hidden;

    width: 100%;

    padding:
        34px 16px 22px;

    border:
        1px solid rgba(196, 157, 78, 0.24);

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            #151411 0%,
            #090908 48%,
            #11100d 100%
        );

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
}


/* =========================================================
   SUBTLE GOLD GLOW
   ========================================================= */

.card::before {
    content: "";

    position: absolute;

    width: 240px;
    height: 240px;

    left: 50%;
    top: -150px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(202, 164, 88, 0.09) 0%,
            rgba(202, 164, 88, 0.035) 35%,
            transparent 72%
        );

    pointer-events: none;
}


/* =========================================================
   FINANCIAL DISTRICT ARCHITECTURE
   ========================================================= */

.architecture {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 220px;

    pointer-events: none;

    opacity: 0.27;
}


/* =========================================================
   BUILDINGS
   ========================================================= */

.building {
    position: absolute;

    bottom: 0;

    border-left:
        1px solid rgba(197, 157, 77, 0.12);

    border-right:
        1px solid rgba(197, 157, 77, 0.12);
}

.building::before {
    content: "";

    position: absolute;

    left: 20%;
    right: 20%;

    top: 12px;
    bottom: 12px;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(197, 157, 77, 0.095) 0,
            rgba(197, 157, 77, 0.095) 1px,
            transparent 1px,
            transparent 15px
        );
}

.building::after {
    content: "";

    position: absolute;

    left: 50%;

    top: 0;
    bottom: 0;

    width: 1px;

    background:
        rgba(197, 157, 77, 0.045);
}

.b1 {
    left: 3%;
    width: 11%;
    height: 92px;
}

.b2 {
    left: 15%;
    width: 15%;
    height: 132px;
}

.b3 {
    left: 32%;
    width: 10%;
    height: 78px;
}

.b4 {
    right: 30%;
    width: 11%;
    height: 108px;
}

.b5 {
    right: 15%;
    width: 15%;
    height: 148px;
}

.b6 {
    right: 3%;
    width: 10%;
    height: 82px;
}


/* =========================================================
   TRADING CANDLES
   ========================================================= */

.candles {
    position: absolute;

    left: 12%;
    right: 12%;
    bottom: 7px;

    height: 110px;

    display: flex;

    align-items: flex-end;
    justify-content: space-around;

    opacity: 0.18;
}

.candle {
    position: relative;

    width: 5px;

    border-radius: 1px;

    background:
        #c9a967;
}

.candle::before {
    content: "";

    position: absolute;

    left: 2px;

    top: -18px;
    bottom: -18px;

    width: 1px;

    background:
        #c9a967;
}

.candle:nth-child(1) {
    height: 32px;
}

.candle:nth-child(2) {
    height: 54px;
}

.candle:nth-child(3) {
    height: 43px;
}

.candle:nth-child(4) {
    height: 72px;
}

.candle:nth-child(5) {
    height: 49px;
}

.candle:nth-child(6) {
    height: 86px;
}

.candle:nth-child(7) {
    height: 62px;
}

.candle:nth-child(8) {
    height: 39px;
}

.candle:nth-child(9) {
    height: 68px;
}


/* =========================================================
   MONOGRAM
   ========================================================= */

.monogram {
    position: relative;
    z-index: 3;

    width: 82px;
    height: 82px;

    margin:
        0 auto 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid rgba(211, 172, 92, 0.58);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255, 255, 255, 0.075),
            transparent 36%
        ),
        linear-gradient(
            145deg,
            #211e18,
            #080807
        );

    color:
        #dfc27f;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 24px;
    font-weight: 700;

    letter-spacing: 3px;

    box-shadow:
        0 0 35px rgba(190, 150, 70, 0.08),
        inset 0 0 20px rgba(190, 150, 70, 0.04);
}

.monogram::after {
    content: "";

    position: absolute;

    inset: 6px;

    border:
        1px solid rgba(211, 172, 92, 0.13);

    border-radius: 50%;
}


/* =========================================================
   NAME
   ========================================================= */

.name {
    position: relative;
    z-index: 3;

    text-align: center;

    color:
        #f2eee5;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 30px;

    line-height: 1.2;

    font-weight: 500;

    letter-spacing: 2.4px;
}


/* =========================================================
   ROLE
   ========================================================= */

.role {
    position: relative;
    z-index: 3;

    margin-top: 10px;

    text-align: center;

    color:
        #c9a967;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 3.5px;

    text-transform: uppercase;
}


/* =========================================================
   SIGNATURE
   ========================================================= */

.quote {
    position: relative;
    z-index: 3;

    margin-top: 13px;

    text-align: center;

    color:
        #918268;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 10px;

    font-style: italic;

    letter-spacing: 1.7px;

    text-transform: uppercase;
}


/* =========================================================
   GOLD DIVIDER
   ========================================================= */

.gold-line {
    position: relative;
    z-index: 3;

    width: 76px;
    height: 1px;

    margin:
        21px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #c9a967,
            transparent
        );
}


/* =========================================================
   CONTACT LINKS
   ========================================================= */

.links {
    position: relative;
    z-index: 3;

    display: grid;

    gap: 9px;

    margin-top: 25px;
}


/* =========================================================
   LINK CARD
   ========================================================= */

.link {
    position: relative;

    display: flex;

    align-items: center;

    width: 100%;
    min-height: 64px;

    padding:
        10px 12px;

    border:
        1px solid rgba(255, 255, 255, 0.065);

    border-radius: 14px;

    background:
        linear-gradient(
            100deg,
            rgba(255, 255, 255, 0.035),
            rgba(255, 255, 255, 0.012)
        );

    color:
        #eeeae1;

    text-decoration: none;

    -webkit-tap-highlight-color:
        transparent;

    transition:
        border-color 0.18s ease,
        background 0.18s ease,
        transform 0.18s ease;
}


/* Desktop hover */

@media (hover: hover) {

    .link:hover {
        transform:
            translateY(-1px);

        border-color:
            rgba(197, 157, 77, 0.30);

        background:
            linear-gradient(
                100deg,
                rgba(190, 150, 70, 0.07),
                rgba(255, 255, 255, 0.015)
            );
    }

}


/* Mobile press */

.link:active {
    transform:
        scale(0.992);
}


/* =========================================================
   LINK ICON
   ========================================================= */

.icon {
    width: 40px;
    height: 40px;

    flex:
        0 0 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid rgba(190, 150, 70, 0.15);

    border-radius: 10px;

    background:
        rgba(190, 150, 70, 0.035);

    color:
        #d6b66e;

    font-size: 17px;
}


/* =========================================================
   LINK INFORMATION
   ========================================================= */

.link-info {
    min-width: 0;

    margin-left: 12px;
}

.label {
    display: block;

    margin-bottom: 4px;

    color:
        #77736b;

    font-size: 9px;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}

.value {
    display: block;

    color:
        #e9e5dc;

    font-size: 13.5px;

    font-weight: 500;

    line-height: 1.35;

    overflow-wrap:
        anywhere;
}


/* =========================================================
   ARROW
   ========================================================= */

.arrow {
    flex:
        0 0 auto;

    margin-left: auto;
    padding-left: 8px;

    color:
        #55524d;

    font-size: 20px;

    line-height: 1;
}

@media (hover: hover) {

    .link:hover .arrow {
        color:
            #c9a967;
    }

}


/* =========================================================
   PHONE NUMBER
   ========================================================= */

.phone-number {
    white-space: nowrap;

    letter-spacing:
        0.15px;
}


/* =========================================================
   PAYMENT SECTION
   ========================================================= */

.payment {
    position: relative;
    z-index: 3;

    margin-top: 15px;

    overflow: hidden;

    border:
        1px solid rgba(190, 150, 70, 0.20);

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(190, 150, 70, 0.055),
            rgba(255, 255, 255, 0.012)
        );
}


/* =========================================================
   PAYMENT HEADER
   ========================================================= */

.payment-header {
    width: 100%;

    min-height: 62px;

    padding:
        13px 15px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    border: 0;

    background:
        transparent;

    color:
        inherit;

    font-family:
        inherit;

    text-align:
        left;

    cursor:
        pointer;

    -webkit-tap-highlight-color:
        transparent;
}

.payment-header:focus-visible {
    outline:
        2px solid rgba(201, 169, 103, 0.6);

    outline-offset:
        -2px;
}


/* =========================================================
   PAYMENT LEFT
   ========================================================= */

.payment-left {
    display: flex;

    align-items: center;

    gap: 10px;
}

.payment-icon {
    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid rgba(190, 150, 70, 0.20);

    border-radius: 8px;

    color:
        #d6b66e;

    font-size: 11px;
}

.payment-title {
    color:
        #d6b66e;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 2.5px;

    text-transform: uppercase;
}

.payment-subtitle {
    margin-top: 3px;

    color:
        #55524d;

    font-size: 8px;

    letter-spacing: 0.7px;
}


/* =========================================================
   CHEVRON
   ========================================================= */

.payment-chevron {
    color:
        #b99550;

    font-size: 17px;

    line-height: 1;

    transition:
        transform 0.2s ease;
}

.payment.open .payment-chevron {
    transform:
        rotate(180deg);
}


/* =========================================================
   PAYMENT BODY
   ========================================================= */

.payment-body {
    display: none;

    padding:
        0 14px 14px;
}

.payment.open .payment-body {
    display: block;
}


/* =========================================================
   PAYMENT BOX
   ========================================================= */

.payment-box {
    padding:
        12px;

    margin-top:
        8px;

    border:
        1px solid rgba(255, 255, 255, 0.055);

    border-radius:
        12px;

    background:
        rgba(0, 0, 0, 0.17);
}


/* =========================================================
   PAYMENT ROW
   ========================================================= */

.payment-row {
    display: flex;

    align-items: center;

    gap: 9px;
}


/* =========================================================
   PAYMENT TEXT
   ========================================================= */

.payment-label {
    margin-bottom: 5px;

    color:
        #625e57;

    font-size: 8px;

    letter-spacing: 1.6px;

    text-transform: uppercase;
}

.payment-value {
    flex: 1;

    min-width: 0;

    color:
        #e7e2d8;

    font-size: 12.5px;

    line-height: 1.5;

    overflow-wrap:
        anywhere;
}

.payment-value strong {
    color:
        #d6b66e;
}


/* =========================================================
   COPY BUTTON
   ========================================================= */

.copy {
    flex:
        0 0 auto;

    min-width: 58px;

    padding:
        8px 9px;

    border:
        1px solid rgba(190, 150, 70, 0.24);

    border-radius:
        8px;

    background:
        rgba(190, 150, 70, 0.05);

    color:
        #d6b66e;

    font-family:
        inherit;

    font-size:
        8px;

    font-weight:
        600;

    letter-spacing:
        1px;

    cursor:
        pointer;

    -webkit-tap-highlight-color:
        transparent;
}

.copy:active {
    background:
        rgba(190, 150, 70, 0.15);
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    position: relative;
    z-index: 3;

    margin-top:
        19px;

    padding-top:
        14px;

    border-top:
        1px solid rgba(255, 255, 255, 0.035);

    text-align:
        center;

    color:
        #46433e;

    font-size:
        7px;

    letter-spacing:
        3px;

    text-transform:
        uppercase;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 420px) {

    .page {
        padding:
            10px 8px 28px;
    }

    .card {
        padding:
            30px 11px 19px;

        border-radius:
            23px;
    }

    .monogram {
        width:
            76px;

        height:
            76px;

        font-size:
            22px;
    }

    .name {
        font-size:
            24px;

        letter-spacing:
            1.8px;
    }

    .role {
        font-size:
            8.5px;

        letter-spacing:
            2.8px;
    }

    .quote {
        font-size:
            9px;

        letter-spacing:
            1.35px;
    }

    .link {
        min-height:
            61px;
    }

    .value {
        font-size:
            13px;
    }

    .phone-number {
        font-size:
            12.5px;
    }

    .architecture {
        height:
            175px;
    }

    .candles {
        left:
            14%;

        right:
            14%;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 350px) {

    .name {
        font-size:
            22px;

        letter-spacing:
            1.2px;
    }

    .role {
        font-size:
            8px;

        letter-spacing:
            2.2px;
    }

    .phone-number {
        font-size:
            11.5px;
    }

    .icon {
        width:
            37px;

        height:
            37px;

        flex-basis:
            37px;
    }

    .link-info {
        margin-left:
            9px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior:
            auto !important;

        transition:
            none !important;
    }

}

</style>

</head>


<body>


<div class="page">


<main class="card">


    <!-- =================================================
         SUBTLE FINANCIAL ARCHITECTURE
         ================================================= -->

    <div
        class="architecture"
        aria-hidden="true"
    >

        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>
        <div class="building b6"></div>


        <div class="candles">

            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>
            <div class="candle"></div>

        </div>

    </div>


    <!-- =================================================
         MONOGRAM
         ================================================= -->

    <div
        class="monogram"
        aria-label="EA"
    >
        EA
    </div>


    <!-- =================================================
         NAME
         ================================================= -->

    <div class="name">
        ERFAN ARABZADE
    </div>
