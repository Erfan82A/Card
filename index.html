<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erfan</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 40px 25px;
      border: 1px solid #333;
      border-radius: 24px;
      background: #111;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    a {
      display: block;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      background: #1c1c1c;
      color: white;
      text-decoration: none;
    }

    a:hover {
      background: #292929;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>ERFAN</h1>
    <p>Trader • Investor</p>

    <a href="#">Instagram</a>
    <a href="#">Telegram</a>
    <a href="#">Contact</a>
    <a href="#">Email</a>
  </div>

</body>
</html>
