<head>

    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<meta

    content="ERFAN ARABZADE — Trader & Investor"
/>

    name="theme-color"

/>

    name="color-scheme"
    content="dark"

<style>

/* =========================================================
   ERFAN ARABZADE
   DIGITAL BUSINESS CARD
   FINAL STABLE LUXURY EDITION

   Design:
   Matte Black / Brushed Gold / Finance / Old Money

   Compatibility:
   Chrome
   Samsung Internet
   Safari
   Firefox
   Edge
   ========================================================= */


/* ---------------------------------------------------------
   RESET
   --------------------------------------------------------- */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #050505;
}

body {

    min-height: 100vh;

    color: #eeeae0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    overflow-x: hidden;

    padding:
        18px
        12px
        36px;
}


/* ---------------------------------------------------------
   BACKGROUND
   --------------------------------------------------------- */

body::before {

    content: "";

    position: fixed;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    pointer-events: none;

    background-image:

        linear-gradient(
            rgba(190,150,70,0.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(190,150,70,0.018) 1px,
            transparent 1px
        );

    background-size:
        48px 48px;

    z-index: 0;
}


/* ---------------------------------------------------------
   MAIN PAGE
   --------------------------------------------------------- */

.page {

    width: 100%;

    max-width: 460px;

    margin:
        0 auto;

    position: relative;

    z-index: 1;
}


/* ---------------------------------------------------------
   CARD
   --------------------------------------------------------- */

.card {

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            145deg,
            #12110f 0%,
            #090908 48%,
            #11100d 100%
        );

    border:
        1px solid
        rgba(190,150,70,0.23);

    border-radius:
        26px;

    padding:
        34px
        16px
        20px;

    box-shadow:

        0 30px 70px
        rgba(0,0,0,0.62),

        inset 0 1px 0
        rgba(255,255,255,0.035);
}


/* ---------------------------------------------------------
   ARCHITECTURE
   --------------------------------------------------------- */

.architecture {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 205px;

    pointer-events: none;

    opacity: 0.25;
}


/* Buildings */

.building {

    position: absolute;

    bottom: 0;

    border-left:
        1px solid
        rgba(190,150,70,0.10);

    border-right:
        1px solid
        rgba(190,150,70,0.10);
}


.building::before {

    content: "";

    position: absolute;

    left: 20%;
    right: 20%;

    top: 12px;
    bottom: 12px;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(190,150,70,0.09) 0px,
            rgba(190,150,70,0.09) 1px,
            transparent 1px,
            transparent 15px
        );
}


.b1 {
    left: 3%;
    width: 12%;
    height: 90px;
}

.b2 {
    left: 16%;
    width: 15%;
    height: 130px;
}

.b3 {
    left: 33%;
    width: 10%;
    height: 75px;
}

.b4 {
    right: 31%;
    width: 11%;
    height: 105px;
}

.b5 {
    right: 16%;
    width: 14%;
    height: 145px;
}

.b6 {
    right: 3%;
    width: 10%;
    height: 80px;
}


/* ---------------------------------------------------------
   TRADING CANDLES
   --------------------------------------------------------- */

.candles {

    position: absolute;

    left: 13%;
    right: 13%;

    bottom: 8px;

    height: 105px;

    display: flex;

    align-items: flex-end;

    justify-content:
        space-around;

    opacity: 0.16;
}


.candle {

    position: relative;

    width: 5px;

    background:
        #c9a967;

    border-radius: 1px;
}


/* Candle wick */

.candle::before {

    content: "";

    position: absolute;

    left: 2px;

    width: 1px;

    background:
        #c9a967;

    top: -18px;

    bottom: -18px;
}


.c1 {
    height: 32px;
}

.c2 {
    height: 54px;
}

.c3 {
    height: 43px;
}

.c4 {
    height: 70px;
}

.c5 {
    height: 49px;
}

.c6 {
    height: 84px;
}

.c7 {
    height: 61px;
}

.c8 {
    height: 38px;
}

.c9 {
    height: 67px;
}


/* ---------------------------------------------------------
   MONOGRAM
   --------------------------------------------------------- */

.monogram {

    position: relative;

    z-index: 2;

    width: 82px;
    height: 82px;

    margin:
        0 auto
        22px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    border:
        1px solid
        rgba(205,166,87,0.55);

    background:

        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,0.08),
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #201d18,
            #080807
        );

    color:
        #dfc27f;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        24px;

    font-weight:
        bold;

    letter-spacing:
        3px;

    box-shadow:

        0 0 35px
        rgba(190,150,70,0.08),

        inset 0 0 20px
        rgba(190,150,70,0.04);
}


.monogram::after {

    content: "";

    position: absolute;

    inset: 6px;

    border:
        1px solid
        rgba(205,166,87,0.12);

    border-radius: 50%;
}


/* ---------------------------------------------------------
   NAME
   --------------------------------------------------------- */

.name {

    position: relative;

    z-index: 2;

    text-align:
        center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            25px,
            7vw,
            35px
        );

    font-weight:
        500;

    letter-spacing:
        2.5px;

    line-height:
        1.2;

    color:
        #f2eee5;
}


/* ---------------------------------------------------------
   ROLE
   --------------------------------------------------------- */

.role {

    position: relative;

    z-index: 2;

    text-align:
        center;

    margin-top:
        10px;

    color:
        #c9a967;

    font-size:
        10px;

    font-weight:
        600;

    letter-spacing:
        3.5px;

    text-transform:
        uppercase;
}


/* ---------------------------------------------------------
   SIGNATURE QUOTE
   --------------------------------------------------------- */

.quote {

    position: relative;

    z-index: 2;

    text-align:
        center;

    margin-top:
        13px;

    color:
        #8e8063;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        10px;

    font-style:
        italic;

    letter-spacing:
        1.7px;

    text-transform:
        uppercase;
}


/* ---------------------------------------------------------
   GOLD LINE
   --------------------------------------------------------- */

.gold-line {

    position: relative;

    z-index: 2;

    width:
        70px;

    height:
        1px;

    margin:
        21px auto 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            #c9a967,
            transparent
        );
}


/* ---------------------------------------------------------
   CONTACT LINKS
   --------------------------------------------------------- */

.links {

    position: relative;

    z-index: 2;

    display:
        grid;

    gap:
        9px;

    margin-top:
        25px;
}


.link {

    min-height:
        64px;

    display:
        flex;

    align-items:
        center;

    padding:
        10px 12px;

    text-decoration:
        none;

    color:
        #eeeae0;

    background:

        linear-gradient(
            100deg,
            rgba(255,255,255,0.035),
            rgba(255,255,255,0.012)
        );

    border:
        1px solid
        rgba(255,255,255,0.065);

    border-radius:
        14px;

    transition:
        border-color
        0.2s ease,

        background
        0.2s ease,

        transform
        0.2s ease;
}


.link:hover {

    transform:
        translateY(-1px);

    border-color:
        rgba(190,150,70,0.30);

    background:

        linear-gradient(
            100deg,
            rgba(190,150,70,0.07),
            rgba(255,255,255,0.015)
        );
}


.icon {

    width:
        39px;

    height:
        39px;

    flex:
        0 0 39px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        10px;

    border:
        1px solid
        rgba(190,150,70,0.14);

    background:
        rgba(190,150,70,0.035);

    color:
        #d6b66e;

    font-size:
        17px;
}


.link-info {

    min-width:
        0;

    margin-left:
        12px;
}


.label {

    display:
        block;

    margin-bottom:
        3px;

    color:
        #77736b;

    font-size:
        9px;

    letter-spacing:
        1.6px;

    text-transform:
        uppercase;
}


.value {

    display:
        block;

    color:
        #e9e5dc;

    font-size:
        13.5px;

    font-weight:
        500;

    overflow-wrap:
        anywhere;
}


.arrow {

    margin-left:
        auto;

    color:
        #55524d;

    font-size:
        20px;

    padding-left:
        8px;
}


.link:hover .arrow {

    color:
        #c9a967;
}


/* ---------------------------------------------------------
   PAYMENT
   --------------------------------------------------------- */

.payment {

    position: relative;

    z-index: 2;

    margin-top:
        15px;

    overflow:
        hidden;

    border:
        1px solid
        rgba(190,150,70,0.20);

    border-radius:
        17px;

    background:

        linear-gradient(
            145deg,
            rgba(190,150,70,0.055),
            rgba(255,255,255,0.012)
        );
}


.payment-header {

    min-height:
        62px;

    padding:
        13px 15px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    cursor:
        pointer;

    -webkit-tap-highlight-color:
        transparent;
}


.payment-left {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;
}


.payment-icon {

    width:
        30px;

    height:
        30px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        8px;

    border:
        1px solid
        rgba(190,150,70,0.20);

    color:
        #d6b66e;

    font-size:
        11px;
}


.payment-title {

    color:
        #d6b66e;

    font-size:
        10px;

    font-weight:
        600;

    letter-spacing:
        2.5px;

    text-transform:
        uppercase;
}


.payment-subtitle {

    margin-top:
        3px;

    color:
        #55524d;

    font-size:
        8px;

    letter-spacing:
        0.7px;
}


.payment-chevron {

    color:
        #b99550;

    font-size:
        17px;

    transition:
        transform
        0.25s ease;
}


.payment.open .payment-chevron {

    transform:
        rotate(180deg);
}


.payment-body {

    display:
        none;

    padding:
        0 14px 14px;
}


.payment.open .payment-body {

    display:
        block;
}


.payment-box {

    padding:
        12px;

    margin-top:
        8px;

    border-radius:
        12px;

    border:
        1px solid
        rgba(255,255,255,0.055);

    background:
        rgba(0,0,0,0.17);
}


.payment-label {

    margin-bottom:
        5px;

    color:
        #625e57;

    font-size:
        8px;

    letter-spacing:
        1.6px;

    text-transform:
        uppercase;
}


.payment-value {

    color:
        #e7e2d8;

    font-size:
        12.5px;

    line-height:
        1.5;

    overflow-wrap:
        anywhere;
}


.payment-value strong {

    color:
        #d6b66e;
}


.payment-row {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;
}


.payment-row .payment-value {

    flex:
        1;

    min-width:
        0;
}


.copy {

    flex:
        0 0 auto;

    border:
        1px solid
        rgba(190,150,70,0.24);

    border-radius:
        8px;

    background:
        rgba(190,150,70,0.05);

    color:
        #d6b66e;

    padding:
        8px 9px;

    font-size:
        8px;

    font-weight:
        600;

    letter-spacing:
        1px;

    cursor:
        pointer;

    -webkit-tap-highlight-color:
        transparent;
}


.copy:active {

    background:
        rgba(190,150,70,0.15);
}


/* ---------------------------------------------------------
   FOOTER
   --------------------------------------------------------- */

.footer {

    position: relative;

    z-index: 2;

    margin-top:
        19px;

    padding-top:
        14px;

    border-top:
        1px solid
        rgba(255,255,255,0.035);

    text-align:
        center;

    color:
        #46433e;

    font-size:
        7px;

    letter-spacing:
        3px;

    text-transform:
        uppercase;
}


/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */

@media (max-width: 420px) {

    body {

        padding:
            10px
            9px
            24px;
    }

    .card {

        padding:
            30px
            12px
            18px;

        border-radius:
            23px;
    }

    .monogram {

        width:
            76px;

        height:
            76px;

        font-size:
            22px;
    }

    .name {

        font-size:
            24px;

        letter-spacing:
            2px;
    }

    .role {

        font-size:
            8.5px;

        letter-spacing:
            3px;
    }

    .quote {

        font-size:
            9px;

        letter-spacing:
            1.4px;
    }

    .link {

        min-height:
            61px;
    }

    .value {

        font-size:
            13px;
    }

    .architecture {

        height:
            165px;
    }

    .candles {

        left:
            15%;

        right:
            15%;
    }
}

</style>
</head>
