<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="ERFAN ARABZADE — Trader & Investor">
  <meta name="robots" content="index, follow">

  <title>ERFAN ARABZADE — Trader & Investor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #050505;
      --black-2: #0a0a0a;
      --panel: rgba(18, 18, 18, 0.72);

      --gold: #c6a15b;
      --gold-light: #e2c982;
      --gold-soft: rgba(198, 161, 91, 0.18);

      --white: #f4f1e9;
      --muted: #8d8a82;
      --muted-2: #5e5b55;

      --border: rgba(198, 161, 91, 0.17);
      --border-soft: rgba(255, 255, 255, 0.065);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(
          ellipse at 50% -15%,
          rgba(198, 161, 91, 0.105),
          transparent 42%
        ),
        radial-gradient(
          ellipse at 100% 70%,
          rgba(198, 161, 91, 0.035),
          transparent 32%
        ),
        linear-gradient(145deg, #030303, #080808 50%, #040404);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      display: flex;
      justify-content: center;
      padding: 24px 14px 40px;
      overflow-x: hidden;
    }

    /*
      FINANCIAL DISTRICT GRID
      Extremely subtle so the page keeps the same
      visual language as the engraved card.
    */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(198, 161, 91, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(198, 161, 91, 0.025) 1px,
          transparent 1px
        );

      background-size: 46px 46px;

      mask-image:
        linear-gradient(
          to bottom,
          black 0%,
          rgba(0,0,0,0.75) 35%,
          transparent 90%
        );

      pointer-events: none;
    }

    /*
      VERY SOFT GOLD ATMOSPHERE
    */

    body::after {
      content: "";
      position: fixed;

      width: 420px;
      height: 420px;

      left: 50%;
      top: 15%;

      transform: translateX(-50%);

      background: rgba(198, 161, 91, 0.035);

      filter: blur(100px);

      border-radius: 50%;

      pointer-events: none;
    }

    .page {
      width: 100%;
      max-width: 470px;
      position: relative;
      z-index: 2;
    }

    /*
      MAIN CARD
    */

    .identity {
      position: relative;

      overflow: hidden;

      padding: 38px 20px 22px;

      border: 1px solid var(--border);

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.045),
          rgba(255,255,255,0.012)
        );

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 35px 90px rgba(0,0,0,0.65),
        inset 0 1px 0 rgba(255,255,255,0.035);

      animation: reveal 0.8s ease both;
    }

    /*
      DECORATIVE ARCHITECTURAL LINES
      Mimic engraved buildings / candlesticks.
    */

    .architecture {
      position: absolute;
      inset: 0;

      pointer-events: none;
      opacity: 0.42;
    }

    .architecture span {
      position: absolute;
      bottom: -10px;

      width: 1px;

      background:
        linear-gradient(
          to top,
          rgba(198,161,91,0.15),
          rgba(198,161,91,0.035),
          transparent
        );
    }

    .architecture span:nth-child(1) {
      left: 8%;
      height: 100px;
    }

    .architecture span:nth-child(2) {
      left: 14%;
      height: 145px;
    }

    .architecture span:nth-child(3) {
      left: 20%;
      height: 75px;
    }

    .architecture span:nth-child(4) {
      right: 14%;
      height: 125px;
    }

    .architecture span:nth-child(5) {
      right: 20%;
      height: 82px;
    }

    .architecture span:nth-child(6) {
      right: 8%;
      height: 160px;
    }

    .architecture::after {
      content: "";

      position: absolute;

      left: 7%;
      right: 7%;
      bottom: 30px;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(198,161,91,0.14),
          transparent
        );
    }

    /*
      MONOGRAM
    */

    .monogram {
      position: relative;

      width: 76px;
      height: 76px;

      margin: 0 auto 23px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border: 1px solid rgba(198,161,91,0.42);

      background:
        radial-gradient(
          circle at 30% 25%,
          rgba(255,255,255,0.10),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #191714,
          #070707
        );

      color: var(--gold-light);

      font-family: Georgia, "Times New Roman", serif;

      font-size: 23px;
      font-weight: 700;

      letter-spacing: 2px;

      box-shadow:
        0 0 45px rgba(198,161,91,0.075),
        inset 0 0 22px rgba(198,161,91,0.035);
    }

    .monogram::before {
      content: "";

      position: absolute;
      inset: 6px;

      border-radius: 50%;

      border: 1px solid rgba(198,161,91,0.10);
    }

    /*
      NAME
    */

    h1 {
      position: relative;

      text-align: center;

      color: var(--white);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(25px, 7vw, 36px);

      font-weight: 500;

      letter-spacing: 2.8px;

      line-height: 1.2;
    }

    .role {
      position: relative;

      margin-top: 10px;

      text-align: center;

      color: var(--gold);

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 3.6px;

      text-transform: uppercase;
    }

      position: relative;

      width: 72px;
      height: 1px;

      margin: 24px auto 0;

      background:
